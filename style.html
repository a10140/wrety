<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WREP AI Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-bg-hover: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 255, 255, 0.16);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --sidebar-width: 264px;
            --mobile-header-height: 60px;
            --accent: #6366f1;
            --accent-dim: rgba(99, 102, 241, 0.15);
            --accent-glow: rgba(99, 102, 241, 0.25);
            --brand-gradient: linear-gradient(135deg, #fff 0%, #c7d2fe 40%, #818cf8 100%);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99, 102, 241, 0.11) 0%, transparent 65%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(139, 92, 246, 0.07) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        /* Thin scrollbars */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* ── Logo ── */
        .wrep-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 3px;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .wrep-tag {
            font-size: 9px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 1.5px;
            border: 1px solid rgba(99, 102, 241, 0.35);
            padding: 2px 7px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
            font-family: 'Inter', sans-serif;
            background: rgba(99, 102, 241, 0.08);
        }

        /* ── Sidebar ── */
        #sidebar {
            width: var(--sidebar-width);
            background: rgba(9, 9, 12, 0.93);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-right: 1px solid var(--glass-border);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            position: relative;
        }

        .brand-container {
            display: flex;
            align-items: center;
            padding: 6px 8px 18px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 14px;
        }

        .new-chat-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 11px 14px;
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 10px;
            letter-spacing: 0.2px;
        }
        .new-chat-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-hover);
            transform: translateY(-1px);
        }
        .new-chat-btn:active { transform: translateY(0); }

        .sidebar-section-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.4px;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 2px 8px 8px;
        }

        #history-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -4px;
            padding: 0 4px;
        }

        .history-item {
            padding: 9px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-item::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .history-item:hover {
            background: var(--glass-bg-hover);
            color: var(--text-primary);
        }
        .history-item:hover::before { background: var(--accent); }
        .history-item:active { background: var(--glass-bg); }

        /* Sidebar footer */
        .sidebar-footer {
            padding: 14px 8px 0;
            border-top: 1px solid var(--glass-border);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: white;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        #user-display {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .logout-btn {
            padding: 7px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            color: var(--text-muted);
            display: flex;
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.1); color: #f87171; }

        #sidebar-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
            backdrop-filter: blur(4px);
        }

        /* ── Main chat area ── */
        #main-chat {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
            z-index: 1;
        }

        /* ── Mobile header ── */
        #mobile-header {
            display: none;
            height: var(--mobile-header-height);
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(16px);
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            z-index: 50;
        }
        .mobile-menu-btn {
            padding: 8px;
            margin-left: -8px;
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.2s;
        }
        .mobile-menu-btn:hover { background: var(--glass-bg-hover); }

        /* ── Chat container ── */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px 0 186px;
            scroll-behavior: smooth;
        }

        /* ── Messages ── */
        .message {
            max-width: 780px;
            margin: 0 auto;
            padding: 6px 28px;
            animation: msgIn 0.3s ease-out both;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(99, 102, 241, 0.8); }
            50%       { opacity: 0.4; box-shadow: 0 0 2px rgba(99, 102, 241, 0.3); }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        /* AI message */
        .message.bot .message-content {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 4px 16px 16px 16px;
            padding: 14px 18px;
        }

        /* User message — right-aligned bubble */
        .message.user {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .message.user .message-header { justify-content: flex-end; }
        .message.user .message-content {
            background: var(--accent-dim);
            border: 1px solid rgba(99, 102, 241, 0.22);
            border-radius: 16px 4px 16px 16px;
            padding: 12px 16px;
            max-width: 85%;
        }

        .message-content {
            font-size: 15px;
            line-height: 1.75;
            color: #d4d4d8;
            font-weight: 400;
            word-break: break-word;
        }

        /* AI name badge */
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #a5b4fc;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .ai-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.8);
            flex-shrink: 0;
        }
        .ai-dot.pulsing { animation: pulse 1.2s ease-in-out infinite; }

        /* ── Collapse cards ── */
        .collapse-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .collapse-card:hover { border-color: var(--glass-border-hover); }
        .collapse-header {
            padding: 9px 14px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }
        .collapse-header:hover { color: var(--text-primary); }
        .collapse-header .chevron {
            margin-left: auto;
            transition: transform 0.25s ease;
            opacity: 0.45;
        }
        .collapse-body {
            padding: 12px 14px;
            border-top: 1px solid var(--glass-border);
            font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
            font-size: 12px;
            color: #71717a;
            display: none;
            background: rgba(0, 0, 0, 0.3);
            line-height: 1.65;
        }
        .collapse-body.open { display: block; }

        /* ── Input area ── */
        #input-area-wrapper {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            z-index: 10;
        }

        .glass-input-panel {
            width: 740px;
            max-width: 100%;
            background: rgba(15, 15, 18, 0.84);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 14px 16px;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .glass-input-panel:focus-within {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow:
                0 24px 56px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(99, 102, 241, 0.12),
                0 0 24px rgba(99, 102, 241, 0.07);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            height: 24px;
            max-height: 160px;
            padding: 0 4px;
            line-height: 1.65;
        }
        textarea::placeholder { color: var(--text-muted); }

        .panel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tools { display: flex; gap: 6px; }

        .toggle-btn {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 5px 11px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            user-select: none;
        }
        .toggle-btn:hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .toggle-btn.active {
            background: var(--accent-dim);
            color: #a5b4fc;
            border-color: rgba(99, 102, 241, 0.35);
            font-weight: 600;
        }
        .toggle-btn input { display: none; }

        .send-icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--text-primary);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #09090b;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .send-icon-btn:hover {
            background: white;
            transform: scale(1.06);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.22);
        }
        .send-icon-btn:active { transform: scale(0.95); }

        /* ── Login overlay ── */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #111115;
            border: 1px solid var(--glass-border);
            padding: 36px 32px;
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.65), transparent);
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            margin: 0 0 28px;
            line-height: 1.6;
        }

        .login-input {
            width: 100%;
            padding: 13px 16px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14.5px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .login-input:focus {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .login-input::placeholder { color: var(--text-muted); }

        .btn-full {
            width: 100%;
            padding: 13px;
            margin-top: 16px;
            border-radius: var(--radius-md);
            border: none;
            background: white;
            color: #09090b;
            font-weight: 700;
            font-size: 14.5px;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
        }
        .btn-full:hover {
            background: #e4e4e7;
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        }
        .btn-full:active { transform: translateY(0); }

        .login-switch {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
        }
        .login-switch:hover { color: var(--text-secondary); }

        .login-divider {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
        }

        .guest-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.2s;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .guest-btn:hover { color: var(--text-secondary); }

        /* ── Mobile responsive ── */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0; left: 0;
                height: 100%;
                transform: translateX(-100%);
                box-shadow: 24px 0 48px rgba(0, 0, 0, 0.6);
            }
            #sidebar.open { transform: translateX(0); }
            #sidebar-overlay.open { opacity: 1; pointer-events: auto; }
            #mobile-header { display: flex; }
            #chat-container { padding-top: calc(var(--mobile-header-height) + 16px); }
            #input-area-wrapper {
                bottom: 10px;
                padding: 0 12px;
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .glass-input-panel { border-radius: var(--radius-lg); padding: 12px 14px; }
            .message { padding: 6px 16px; }
            .brand-container { display: none; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <div style="margin-bottom: 24px;">
                <span class="wrep-logo" style="font-size: 34px;">WREP</span>
            </div>
            <p class="login-subtitle">Identify yourself to access the core.</p>
            <div id="auth-form">
                <input type="text" class="login-input" id="username" placeholder="Codename" autocomplete="username">
                <input type="password" class="login-input" id="password" placeholder="Access Key" autocomplete="current-password">
                <button class="btn-full" onclick="handleAuth()">Initialize</button>
                <div class="login-switch" onclick="toggleAuthMode()">
                    <span id="switch-text">Register New Identity</span>
                </div>
            </div>
            <div class="login-divider">
                <button class="guest-btn" onclick="loginAsGuest()">Guest Access</button>
            </div>
        </div>
    </div>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div class="brand-container">
            <span class="wrep-logo">WREP</span>
            <span class="wrep-tag">V1.0</span>
        </div>
        <button class="new-chat-btn" onclick="startNewChat(); toggleSidebar();">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
            New Session
        </button>
        <div class="sidebar-section-label">History</div>
        <div id="history-list"></div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">ID</div>
                <div id="user-display">Unknown</div>
            </div>
            <div class="logout-btn" onclick="logout()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
            </div>
        </div>
    </div>

    <div id="main-chat">
        <div id="mobile-header">
            <div class="mobile-menu-btn" onclick="toggleSidebar()">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
            </div>
            <div class="wrep-logo" style="font-size: 18px;">WREP</div>
            <div style="width: 38px;"></div>
        </div>

        <div id="chat-container"></div>

        <div id="input-area-wrapper">
            <div class="glass-input-panel">
                <textarea id="user-input" placeholder="Execute command..." rows="1" oninput="autoResize(this)"></textarea>
                <div class="panel-footer">
                    <div class="tools">
                        <label class="toggle-btn" title="Web Search">
                            <input type="checkbox" id="use-search">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            Search
                        </label>
                        <label class="toggle-btn" title="Deep Think">
                            <input type="checkbox" id="use-think">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 0 1 8 8c0 3.2-1.8 6-4.5 7.3-.6.3-1 .9-1 1.7V22h-5v-3c0-.8-.4-1.4-1-1.7C4.8 16 3 13.2 3 10a8 8 0 0 1 9-8z"></path></svg>
                            Think
                        </label>
                    </div>
                    <button class="send-icon-btn" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentSessionId = null;
        let isRegisterMode = false;

        document.querySelectorAll('.toggle-btn input').forEach(input => {
            input.addEventListener('change', function() {
                this.parentElement.classList.toggle('active', this.checked);
            });
        });

        window.onload = () => {
            const storedUser = localStorage.getItem('gpt_user');
            if (storedUser) { currentUser = storedUser; initApp(); }
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }

        function initApp() {
            document.getElementById('login-overlay').style.display = 'none';
            const displayName = currentUser.length > 8 ? 'Guest' : currentUser;
            document.getElementById('user-display').innerText = displayName;
            document.getElementById('user-avatar').innerText = displayName.slice(0, 2).toUpperCase();
            loadHistoryList();
            startNewChat();
        }

        function loginAsGuest() {
            currentUser = 'guest_' + Math.random().toString(36).substring(2, 8);
            localStorage.setItem('gpt_user', currentUser);
            initApp();
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('switch-text').innerText = isRegisterMode ? "Back to Login" : "Register New Identity";
            document.querySelector('#auth-form button').innerText = isRegisterMode ? "Register" : "Initialize";
        }

        async function handleAuth() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const endpoint = isRegisterMode ? 'api.php?act=register' : 'api.php?act=login';
            if(!u || !p) return;
            try {
                const res = await fetch(endpoint, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                if(res.ok) {
                    if(isRegisterMode) { alert("Identity Created."); toggleAuthMode(); }
                    else { currentUser = u; localStorage.setItem('gpt_user', u); initApp(); }
                } else { alert((await res.json()).detail); }
            } catch(e) {}
        }

        function logout() { localStorage.removeItem('gpt_user'); location.reload(); }
        function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

        function startNewChat() {
            currentSessionId = Date.now().toString();
            document.getElementById('chat-container').innerHTML = `
                <div id="welcome-state" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:10px; padding:40px 20px; animation:msgIn 0.5s ease-out both;">
                    <div class="wrep-logo" style="font-size:52px; opacity:0.92;">WREP</div>
                    <div style="font-size:11px; font-weight:700; letter-spacing:3px; color:var(--text-muted); text-transform:uppercase; margin-top:2px;">System Online</div>
                    <div style="width:48px; height:1px; background:linear-gradient(90deg, transparent, rgba(99,102,241,0.55), transparent); margin:6px 0;"></div>
                    <p style="font-size:14px; color:var(--text-muted); margin:0; max-width:300px; text-align:center; line-height:1.7;">Ready to process your commands.<br>Ask me anything.</p>
                </div>
            `;
        }

        async function loadHistoryList() {
            const res = await fetch(`api.php?act=history&user=${currentUser}`);
            const list = await res.json();
            const div = document.getElementById('history-list');
            div.innerHTML = '';
            list.slice(0, 15).forEach(sid => {
                const item = document.createElement('div');
                item.className = 'history-item';
                const d = new Date(parseInt(sid));
                item.innerText = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                item.onclick = () => { loadSession(sid); if(window.innerWidth<=768) toggleSidebar(); };
                div.appendChild(item);
            });
        }

        async function loadSession(sid) {
            currentSessionId = sid;
            const res = await fetch(`api.php?act=session&sid=${sid}`);
            const msgs = await res.json();
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            msgs.forEach(m => appendMessage(m));
        }

        function appendMessage(msgData) {
            const container = document.getElementById('chat-container');
            if(container.querySelector('#welcome-state')) container.innerHTML = '';

            const isBot = msgData.role === 'assistant';
            const div = document.createElement('div');
            div.className = 'message ' + (isBot ? 'bot' : 'user');

            const header = isBot ?
                `<div class="message-header"><span class="ai-badge"><span class="ai-dot"></span> WREP AI</span></div>` :
                `<div class="message-header">You</div>`;

            let extraHtml = '';
            if(msgData.search_info) extraHtml += `<div class="collapse-card"><div class="collapse-header" onclick="this.nextElementSibling.classList.toggle('open')"><span>&#127758; Network Data</span><svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div><div class="collapse-body">${msgData.search_info}</div></div>`;
            if(msgData.thought) extraHtml += `<div class="collapse-card"><div class="collapse-header" onclick="this.nextElementSibling.classList.toggle('open')"><span>&#129504; Neural Process</span><svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div><div class="collapse-body">${msgData.thought}</div></div>`;

            div.innerHTML = header + extraHtml + `<div class="message-content">${msgData.content}</div>`;
            container.appendChild(div);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const txt = input.value.trim();
            if(!txt) return;
            const useSearch = document.getElementById('use-search').checked;
            const useThink = document.getElementById('use-think').checked;
            input.value = ''; input.style.height='24px';
            appendMessage({role: 'user', content: txt});

            const loadingId = 'loading-' + Date.now();
            const container = document.getElementById('chat-container');
            const loadDiv = document.createElement('div');
            loadDiv.id = loadingId;
            loadDiv.className = 'message bot';
            loadDiv.innerHTML = `<div class="message-header"><span class="ai-badge"><span class="ai-dot pulsing"></span> WREP AI</span></div><div class="message-content" style="color:var(--text-muted);">Processing...</div>`;
            container.appendChild(loadDiv);
            container.scrollTop = container.scrollHeight;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            try {
                const res = await fetch('api.php?act=chat', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: currentUser, message: txt,
                        session_id: currentSessionId,
                        use_search: useSearch, use_deep_think: useThink
                    })
                });
                document.getElementById(loadingId).remove();
                const data = await res.json();
                appendMessage({ role: 'assistant', content: data.answer, thought: data.thought, search_info: data.search_info });
            } catch(e) { document.getElementById(loadingId).innerHTML = `<div class="message-content" style="color:#f87171;">Connection Lost</div>`; }
        }

        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
